name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r ai-core/requirements.txt
      - name: Run Python tests
        working-directory: ai-core
        run: python -m pytest -q
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows executable
        run: dotnet publish desktop/DayZAI.Desktop/DayZAI.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output publish/DayZAI
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DayZ-AI-Windows-x64
          path: publish/DayZAI/
          if-no-files-found: error
          retention-days: 14
